services:
  - type: web
    name: tet-a-tet-api          
    runtime: python
    plan: free                   
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENROUTER_API_KEY  
        sync: false
      - key: GOOGLE_API_KEY      
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free   
